name: Build PocketFlip Native Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Zip If Uploaded Directly From Phone
        run: |
          if [ ! -f "app/build.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Pure Native Android APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PocketFlip-PocoX6Pro.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketFlip-PocoX6Pro-APK
          path: PocketFlip-PocoX6Pro.apk

      - name: Publish Direct 1-Tap APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "PocketFlip Native APK (Build #${{ github.run_number }})"
          body: "Tap **PocketFlip-PocoX6Pro.apk** below under Assets to download and install directly on your Poco X6 Pro."
          files: PocketFlip-PocoX6Pro.apk
